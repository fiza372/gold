name: Gold Strategy 24-7 Cloud Scanner

on:
  schedule:
    # 1. Scans every 15 minutes Monday through Friday for live trade signals
    - cron: '*/15 * * * 1-5'
    # 2. Daily Automatic Morning Market Briefing at 04:00 UTC (9:00 AM PKT / London kickoff)
    - cron: '0 4 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub anytime!

concurrency:
  group: gold-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run Gold Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          IS_DAILY_CRON: ${{ github.event.schedule == '0 4 * * 1-5' && 'true' || 'false' }}
        run: |
          python gold_scanner.py
